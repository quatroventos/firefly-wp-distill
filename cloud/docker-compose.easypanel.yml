# EasyPanel Compose Service.
# Não publica 80/443. Aponte o domínio do EasyPanel para o serviço api, porta 8000.
# Worker, mysql, redis e minio ficam só na rede interna.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-firefly_distill}
      MYSQL_USER: ${DB_USERNAME:-distill}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ffd_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ffd_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ffd_minio:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-firefly_distill}
      DB_USERNAME: ${DB_USERNAME:-distill}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      WORKER_TOKEN: ${WORKER_TOKEN}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://minio:9000}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_BUCKET: ${AWS_BUCKET:-firefly-distill}
      OPENSEO_URL: ${OPENSEO_URL:-}
      OPENSEO_TOKEN: ${OPENSEO_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  horizon:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-firefly_distill}
      DB_USERNAME: ${DB_USERNAME:-distill}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      WORKER_TOKEN: ${WORKER_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "horizon"]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-firefly_distill}
      DB_USERNAME: ${DB_USERNAME:-distill}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      WORKER_TOKEN: ${WORKER_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      API_URL: http://api:8000
      WORKER_TOKEN: ${WORKER_TOKEN}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FFD_SKIP_LIGHTHOUSE: "1"
    shm_size: "2gb"
    depends_on:
      - api

volumes:
  ffd_mysql:
  ffd_redis:
  ffd_minio:
